[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE_URL = "https://placement-management-system-kc5t.onrender.com/api"

# Seamless proxy for /api/* to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://placement-management-system-kc5t.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
