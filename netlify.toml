[build]
  base = "frontend"
  command = "npm ci --include=dev && npm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE_URL = "https://placement-management-system-kc5t.onrender.com/api"

# Seamless proxy for /api/* to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://placement-management-system-kc5t.onrender.com/api/:splat"
  status = 200
  force = true

# Let React Router handle direct links and page refreshes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
